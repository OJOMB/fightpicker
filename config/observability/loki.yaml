server:
  http_listen_port: 3100
  grpc_listen_port: 9095

memberlist:
  join_members:
    - loki:7946
  abort_if_cluster_join_fails: false

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

distributor:
  ring:
    kvstore:
      store: memberlist

ingester:
  wal:
    enabled: true
    dir: /loki/wal
  lifecycler:
    ring:
      replication_factor: 1
      kvstore:
        store: memberlist

limits_config:
  volume_enabled: true
  ingestion_rate_mb: 25
  ingestion_burst_size_mb: 40
  max_concurrent_tail_requests: 50
  retention_period: 168h # 7 days

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      index:
        prefix: index_
        period: 24h
      object_store: filesystem
      schema: v13

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index

query_range:
  parallelise_shardable_queries: true
  cache_results: true

frontend:
  log_queries_longer_than: 5s

frontend_worker:
  frontend_address: loki:9095