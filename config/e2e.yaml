domain: 0.0.0.0
port: 8080

api:
  users: true
  fighters: true

database:
  host: 0.0.0.0
  port: 5432
  user: postgres
  password: postgres
  name: fightpicker
  ssl_mode: disable

auth:
  hashing_cost: 5
  private_key: AUTH_PRIVATE_KEY
  public_key: AUTH_PUBLIC_KEY
  access_ttl_hours: 1
  refresh_ttl_hours: 24
  token_issuer: fightpicker
  token_audience: fightpicker_users

log_level: -4  # Debug level logging

observability:
  # logs, traces, metrics
  otel:
    enable: true
    endpoint: localhost:4317
  # profiling
  pyroscope:
    enable: true
    endpoint: http://localhost:4141

aws:
  region: eu-west-1
  s3_media_bucket: fightpicks-media
  access_key_id: AWS_ACCESS_KEY_ID
  secret_access_key: AWS_SECRET_ACCESS_KEY
  endpoint: http://localhost:9000
  use_path_style: true
  presign_url_ttl_minutes: 30
