##################################
# Network
##################################

bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

##################################
# General
##################################

daemonize no
supervised no
loglevel notice
logfile ""

##################################
# Persistence
##################################

# RDB snapshots (safety net)
save 900 1
save 300 10
save 60 10000

# AOF persistence (recommended)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

##################################
# Memory Management
##################################

maxmemory 256mb
maxmemory-policy allkeys-lru

##################################
# Security (local-only, no auth)
##################################

# If you expose Redis outside the cluster later, enable AUTH.
requirepass redis-secret-password

##################################
# Performance
##################################

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

##################################
# Container friendliness
##################################

# Prevent Redis from exiting when it cannot persist
stop-writes-on-bgsave-error no

##################################
# End of file
##################################
