components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # -------------------------#
    #     AUTH STRUCTURES      #
    # -------------------------#

    LoginRequest:
      description: User login request body
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password

    AuthResponse:
      description: |
        Authentication response.
        The refresh token is issued via an HttpOnly cookie and is not included in the response body.
      type: object
      properties:
        access_token:
          type: string
          format: jwt
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - access_token

    # ----------------------------------#
    #     REUSABLE DATA STRUCTURES      #
    # ----------------------------------#

    SimpleDate:
      type: string
      format: date
      example: "1990-01-01"

    # ------------------------#
    #     USER STRUCTURES     #
    # ------------------------#

    UserCreateReq:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        dob:
          $ref: '#/components/schemas/SimpleDate'
        gender:
          type: string
          enum:
            - male
            - female
            - other
        location:
          type: string
        bio:
          type: string
        password:
          type: string
          format: password
      required:
        - email
        - first_name
        - last_name
        - username
        - dob
        - gender
        - password

    UserResponse:
      type: object
      properties:
        id:
          type: string
          x-go-type: id.UUID7
          x-go-import:
            path: github.com/OJOMB/fightpicker/pkg/id
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        dob:
          $ref: '#/components/schemas/SimpleDate'
        gender:
          type: string
          enum:
            - male
            - female
            - other
        location:
          type: string
        bio:
          type: string
        profile_picture:
          description: Presigned URL to access the user's profile picture - may be null if a profile picture has not been set
          type: string
          format: uri
        last_login:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - username
        - bio
        - gender
        - created_at
        - updated_at

    UserProfilePictureUploadURLRequest:
      type: object
      properties:
        content_type:
          type: string
          description: MIME type of the profile picture (e.g., image/jpeg, image/png)
      required:
        - content_type

    UserProfilePictureUploadURLResponse:
      type: object
      properties:
        upload_url:
          type: string
          format: uri
        signed_header:
          type: object
          additionalProperties:
            type: string
      required:
        - upload_url
        - signed_header

    ListUsersResponse:
      description: |
        Paginated list of users.
        presigned profile picture URLs are ommitted in this response for performance reasons.
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        last_seen_id:
          type: string
          x-go-type: id.UUID7
          x-go-import:
            path: github.com/OJOMB/fightpicker/pkg/id
          nullable: true
        page_size:
          type: integer
        total_count:
          type: integer
          description: |
            Total number of users available (ignoring pagination). Useful for clients to understand the size of the dataset.
            if filtering by email or username is used, this will be either 0 or 1.
      required:
        - users
        - page_size
        - last_seen_id
        - total_count

    UserUpdateReq:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        dob:
          $ref: '#/components/schemas/SimpleDate'
        gender:
          type: string
          enum:
            - male
            - female
            - other
        location:
          type: string
        bio:
          type: string
        password:
          type: string
          format: password
      anyOf:
        - required: [email]
        - required: [first_name]
        - required: [last_name]
        - required: [username]
        - required: [dob]
        - required: [location]
        - required: [bio]
        - required: [password]

    # -------------------------#
    #     FIGHTER STRUCTURES   #
    # -------------------------#

    FightersIngestionReq:
      type: array
      items:
        $ref: '#/components/schemas/FighterCreateReq'
      minItems: 1
      maxItems: 50

    FighterCreateReq:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        nickname:
          type: string
        gender:
          type: string
          enum:
            - male
            - female
            - other
        dob:
          $ref: '#/components/schemas/SimpleDate'
        height:
          type: number
          format: double
        weight:
          type: number
          format: double
        reach:
          type: number
          format: double
        stance:
          type: string
        country:
          type: string
        fighting_out_of:
          type: string
        wins:
          type: integer
          default: 0
        losses:
          type: integer
          default: 0
        draws:
          type: integer
          default: 0
        disqualifications:
          type: integer
          default: 0
        no_contests:
          type: integer
          default: 0
      required:
        - first_name
        - last_name
        - nickname
        - gender
        - dob
        - height
        - weight
        - reach
        - stance
        - country
        - fighting_out_of
        - wins
        - losses
        - draws
        - disqualifications
        - no_contests

    FightersIngestionResp:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/FightersIngestionSummary'
        results:
          type: array
          items:
            $ref: '#/components/schemas/FighterIngestionResult'
        request_id:
          type: string
          x-go-type: id.UUID7
          x-go-import:
            path: github.com/OJOMB/fightpicker/pkg/id
