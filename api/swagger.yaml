openapi: 3.0.0
info:
  title: fightpicker API
  version: 1.0.0

servers:
  - url: /api/v1

security:
  - BearerAuth: []

# ---------------------------------------------------------------------------------#
# OperationIds conform to the pattern: {version}.{resource}.{http_method}.{action} #
# all lowercase and snake case where required, e.g. v1.users.get.list              #
# ---------------------------------------------------------------------------------#

paths:
  #------------------------#
  #     AUTHENTICATION     #
  #------------------------#

  /auth/login:
    post:
      security: []
      summary: User login
      operationId: v1.auth.post.login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: Refresh token (HttpOnly)
              schema:
                type: string
                example: >
                  refresh_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...;
                  HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=86400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/refresh:
    post:
      security: []
      summary: Refresh access token
      operationId: v1.auth.post.refresh
      tags:
        - auth
      description: >
        Issues a new access token given a valid refresh token.
        The refresh token is provided via an HttpOnly cookie.
      responses:
        '200':
          description: Access token refreshed successfully
          headers:
            Set-Cookie:
              description: Rotated refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Suspicious activity detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Refresh token revoked or account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      summary: Logout user
      operationId: v1.auth.post.logout
      tags:
        - auth
      security: []
      description: >
        Logs the user out by revoking the refresh token and clearing the refresh cookie.
      responses:
        '204':
          description: Logged out successfully
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  #-------------------------#
  #      USERS PATHS        #
  #-------------------------#

  /users:
    get:
      summary: List users paginated
      description: |
        Returns a paginated list of users.
        Supports cursor-based pagination using `last_seen_id` and `page_size` parameters.
        You can also filter by `email` or `username`. These filter cannot be used in combination with pagination parameters (last_seen_id, page_size).
        The response structure remains the same regardless of whether you use filtering or pagination.
        If no users match the criteria, an empty array is returned.
      operationId: v1.users.get.list
      parameters:
        - name: last_seen_id
          in: query
          required: false
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: |
            will return a user matching the email exactly or empty array if none found (admin only)
            cannot be used in combination with the pagination parameters (last_seen_id, page_size)
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: |
            will return a user matching the username exactly or empty array if none found
            cannot be used in combination with the pagination parameters (last_seen_id, page_size)
      tags:
        - users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      security: []
      summary: Create a new user
      operationId: v1.users.post.create
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateReq'
      responses:
        '201':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email or username already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/verify:
    get:
      security: []
      summary: Verify user email
      operationId: v1.users.get.verify_email
      tags:
        - users
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Email verified successfully
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/{user_id}:
    get:
      summary: Get user by ID
      operationId: v1.users.get.get
      tags:
        - users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      summary: Update user by ID
      operationId: v1.users.patch.update
      tags:
        - users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateReq'
      responses:
        '200':
          description: User successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: the new email or username already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      summary: Delete user by ID
      operationId: v1.users.delete.delete
      tags:
        - users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
      responses:
        '204':
          description: User successfully deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/{user_id}/follow:
    put:
      description: creates a follow relationship between the authenticated user and the specified user
      summary: Follow a user
      operationId: v1.users.put.follow
      tags:
        - users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
      responses:
        '204':
          description: Successfully followed user
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      description: removes the follow relationship between the authenticated user and the specified user if it exists.
      summary: Unfollow a user
      operationId: v1.users.delete.unfollow
      tags:
        - users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
      responses:
        '204':
          description: Successfully unfollowed user
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/{user_id}/followers:
    get:
      summary: List followers of a user in paginated form in descending order of follow time
      operationId: v1.users.get.followers
      tags:
        - users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
        - name: last_seen_id
          in: query
          required: false
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A list of users following the specified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/{user_id}/followees:
    get:
      summary: List users followed by a user in paginated form in descending order of follow time
      operationId: v1.users.get.following
      tags:
        - users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
        - name: last_seen_id
          in: query
          required: false
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A list of users followed by the specified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/{user_id}/profile-picture/upload-url:
    post:
      summary: Generate a pre-signed URL for uploading a profile picture
      operationId: v1.users.post.generate_presigned_url
      tags:
        - users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfilePictureUploadURLRequest'
      responses:
        '200':
          description: Pre-signed upload URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfilePictureUploadURLResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  #-------------------------#
  #     FIGHTERS PATHS      #
  #-------------------------#

  /fighters:
    get:
      summary: List fighters paginated
      description: |
        Returns a paginated list of fighters.
        Supports cursor-based pagination using `last_seen_id` and `page_size` parameters.
        If no fighters match the criteria, an empty array is returned.
      operationId: v1.fighters.get.list
      parameters:
        - name: last_seen_id
          in: query
          required: false
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      tags:
        - fighters
      responses:
        '200':
          description: A list of fighters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFightersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /fighters:ingest:
    post:
      summary: ingest new fighters - optional upsert
      operationId: v1.fighters.post.ingest
      parameters:
        - name: upsert
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            this is an admin-only operation
            if true, existing fighters (matched by first_name, last_name, dob) will be updated with the new data provided
            if false or omitted, an error will be returned if a fighter already exists with the same first_name, last_name and dob
      tags:
        - fighters
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FightersIngestionReq'
      responses:
        '200':
          description: Fighters successfully ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FightersIngestionResp'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /fighters/{fighter_id}:
    get:
      summary: Get fighter by ID
      operationId: v1.fighters.get.get
      tags:
        - fighters
      parameters:
        - name: fighter_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
      responses:
        '200':
          description: Fighter found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FighterResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Fighter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      summary: Update fighter by ID
      operationId: v1.fighters.patch.update
      tags:
        - fighters
      parameters:
        - name: fighter_id
          in: path
          required: true
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import: github.com/OJOMB/fightpicker/pkg/id
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FighterUpdateReq'
      responses:
        '200':
          description: Fighter successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FighterResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Fighter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  #-------------------------#
  #       CARDS PATHS       #
  #-------------------------#

  /cards:
    post:
      summary: Create a card
      operationId: v1.cards.post.create
      tags:
        - cards
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreateReq'
      responses:
        '201':
          description: Card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict with existing resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      summary: List cards paginated
      description: |
        Returns a paginated list of cards ordered by date.
        Supports cursor-based pagination using `last_seen_id` and `page_size` parameters.
        If no cards match the criteria, an empty array is returned.
      operationId: v1.cards.get.list
      tags:
        - cards
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Filter cards by their temporal status.
            `upcoming` returns cards whose date is in the future, `past` returns cards whose date has passed.
            If omitted, all cards are returned.
          schema:
            type: string
            enum:
              - upcoming
              - past
        - name: last_seen_id
          in: query
          required: false
          schema:
            type: string
            x-go-type: id.UUID7
            x-go-import:
              path: github.com/OJOMB/fightpicker/pkg/id
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A list of cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCardsResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /cards/{card_id}:
    get:
      summary: Get card by ID
      operationId: v1.cards.get.get
      tags:
        - cards
      parameters:
