        height:
          type: number
          format: double
        weight:
          type: number
          format: double
        reach:
          type: number
          format: double
        stance:
          type: string
        country:
          type: string
        fighting_out_of:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        disqualifications:
          type: integer
        no_contests:
          type: integer
      anyOf:
        - required: [first_name]
        - required: [last_name]
        - required: [nickname]
        - required: [gender]
        - required: [dob]
        - required: [height]
        - required: [weight]
        - required: [reach]
        - required: [stance]
        - required: [country]
        - required: [fighting_out_of]
        - required: [wins]
        - required: [losses]
        - required: [draws]
        - required: [disqualifications]
        - required: [no_contests]

    FighterResponse:
