    # -------------------------#
    #     ERROR STRUCTURES     #
    # -------------------------#

    ErrorEnvelope:
      type: object
      description: Standard API error wrapper
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
      required:
        - error
      example:
        error:
          code: "BAD_REQUEST"
          message: "Email is required."
          request_id: "c2f0bad52b9f4fb3"

    ErrorObject:
      type: object
      description: Machine-readable error structure
      properties:
        code:
          type: string
          description: Application-level error code (NOT HTTP status)
          example: "INVALID_INPUT"
        message:
          type: string
          description: Human-readable explanation of the error
          example: "Email is required."
        request_id:
          type: string
          description: Correlation ID for tracing the request
          example: "c2f0bad52b9f4fb3"
      required:
        - code
        - message
        - request_id